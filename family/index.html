<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Dojo | Score Samurai</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="../warrior.png">
<link rel="preload" href="../fonts/playfair-display-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../fonts/dm-sans-400-700.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Playfair Display";font-weight:600;font-display:swap;src:url(../fonts/playfair-display-600.woff2) format("woff2")}
@font-face{font-family:"Playfair Display SC";font-weight:400;font-display:swap;src:url(../fonts/playfair-display-sc-400.woff2) format("woff2")}
@font-face{font-family:"DM Sans";font-weight:400 700;font-display:swap;src:url(../fonts/dm-sans-400-700.woff2) format("woff2")}
:root{
  --bg:#f5efe0; --fg:#2a1a12; --muted:#6f5a4e; --maroon:#7a0f14; --on-maroon:#fbf7ee;
  --gold:#c9a24a; --card:#fbf7ee; --line:#e2d7c3; --good:#2f6b3a; --soft:#efe6d2; --warn:#8a4b0f;
  --display:"Playfair Display",Georgia,serif; --sc:"Playfair Display SC","Playfair Display",Georgia,serif; --body:"DM Sans",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{--bg:#1f1512;--fg:#f1e9da;--muted:#b9a897;--maroon:#9b1b21;--gold:#d6b05a;--card:#2a1d19;--line:#44322c;--good:#8cc79a;--soft:#33251f;--warn:#e0a86a;color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;margin:0;min-height:100vh;display:flex;flex-direction:column}
[hidden]{display:none!important}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.band{background:var(--maroon);color:var(--on-maroon)}
.band .wrap{padding-block:18px;display:flex;justify-content:space-between;align-items:center;gap:12px 16px;flex-wrap:wrap}
.wordmark{font-family:var(--sc);font-size:20px;letter-spacing:.14em;text-transform:uppercase;display:inline-block;padding-bottom:4px;border-bottom:1px solid var(--gold)}
.band .who{font-size:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.band .who b{font-weight:600}
.band button{font:inherit;font-size:13px;color:var(--on-maroon);background:transparent;border:1px solid rgba(251,247,238,.55);border-radius:4px;padding:4px 10px;cursor:pointer}
main{flex:1;width:100%}
main>.wrap{padding-block:32px 48px;display:grid;gap:36px}
h1{font-family:var(--display);font-weight:600;font-size:clamp(30px,5vw,42px);line-height:1.1;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:22px;margin:0 0 14px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.lede{color:var(--muted);margin:8px 0 0;max-width:60ch}
.top{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end}
.belt{display:flex;align-items:center;gap:12px;background:var(--soft);padding:12px 16px;border-radius:6px}
.belt .swatch{width:46px;height:14px;border:1px solid rgba(0,0,0,.35);border-radius:2px;flex:none}
.belt b{display:block;font-weight:700}
.belt span{font-size:13px;color:var(--muted)}
.tokens{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px}
.tile .n{font-family:var(--display);font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.tile .l{font-size:13px;color:var(--muted);margin-top:6px}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--maroon)}
.dot.used{background:var(--maroon)}
.dot.credit{border-color:var(--gold);border-style:dashed}
.list{display:grid;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:1fr auto;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);align-items:center}
.row .d{font-weight:500}
.row .s{font-size:14px;color:var(--muted)}
.act{font:inherit;font-size:14px;font-weight:500;color:var(--maroon);background:transparent;text-decoration:none;border:1px solid var(--maroon);border-radius:4px;padding:6px 12px;white-space:nowrap;cursor:pointer;justify-self:start}
.act.primary{background:var(--gold);border-color:var(--gold);color:#2a1a12}
.act[disabled]{opacity:.6;cursor:default}
.pill{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap;justify-self:start}
.pill.good{color:var(--good)}
.pill.warn{color:var(--warn)}
.road{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.move{padding:16px;border-left:3px solid var(--gold);background:var(--card)}
.move .k{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.move .t{font-family:var(--display);font-size:19px;margin:4px 0 6px}
.move .p{font-size:14px;color:var(--muted);margin:0}
.move .st{margin-top:10px;font-size:13px}
.more{margin:14px 0 0;font-size:14px}
.more a{color:var(--maroon);font-weight:500}
.updates .row{grid-template-columns:auto 1fr auto}
.updates .date{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;min-width:72px}
.uptext{grid-column:1/-1;white-space:pre-line;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px;font-size:15px;max-width:70ch}
.note{font-size:14px;color:var(--fg);background:var(--soft);padding:10px 14px;border-radius:6px;margin:0}
.empty{color:var(--muted);margin:0;padding:14px 0;border-bottom:1px solid var(--line)}
form.signin{display:grid;gap:10px;max-width:420px}
form.signin label{font-size:14px;font-weight:500}
form.signin input{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--card);color:var(--fg);width:100%}
form.signin .act{justify-self:start;padding:9px 16px;font-size:15px}
.small{font-size:14px;color:var(--muted);margin:0}
.small a,.lede a{color:var(--maroon)}
footer{border-top:1px solid var(--line)}
footer .wrap{padding-block:24px;display:flex;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--muted)}
footer .line{font-family:var(--display);font-style:italic;color:var(--maroon)}
footer a{color:inherit}
@media (prefers-color-scheme: dark){footer .line,.act,.small a,.lede a,.more a{color:var(--gold)}.act{border-color:var(--gold)}.dot{border-color:var(--gold)}.dot.used{background:var(--gold)}}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (max-width:560px){.top{grid-template-columns:1fr}.row{grid-template-columns:1fr}.updates .row{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="band"><div class="wrap">
  <span class="wordmark">Score Samurai</span>
  <span class="who" id="who" hidden></span>
</div></header>

<main><div class="wrap" id="app" aria-live="polite">
  <p class="small">Opening The Dojo.</p>
</div></main>

<footer><div class="wrap">
  <span class="line">The SAT is a discipline. Master it in The Dojo.</span>
  <span>Sensei Jay. <a href="mailto:senseijay@scoresamurai.com">senseijay@scoresamurai.com</a></span>
</div></footer>

<script src="family.js"></script>
</body>
</html>
