<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Dojo | Score Samurai</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#6e0d12">
<link rel="icon" href="../warrior.png">
<link rel="preload" href="../fonts/playfair-display-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../fonts/dm-sans-400-700.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Playfair Display";font-weight:600 900;font-display:swap;src:url(../fonts/playfair-display-700.woff2) format("woff2")}
@font-face{font-family:"Playfair Display SC";font-weight:400 700;font-display:swap;src:url(../fonts/playfair-display-sc-400.woff2) format("woff2")}
@font-face{font-family:"DM Sans";font-weight:400 700;font-display:swap;src:url(../fonts/dm-sans-400-700.woff2) format("woff2")}
:root{
  --page:#efe7d6; --cream:#f8f3e7; --cream2:#fbf7ee; --line:#e2d7c3; --ink:#1f1512; --muted:#5c544c; --faint:#9c8f84;
  --maroon:#7a0f14; --maroon-dk:#4d090c; --gold:#c9a24a; --goldtext:#e9d9b6; --green:#2f8f4e; --rose:#f3e4e4; --sand:#ece3d2;
  --display:"Playfair Display",Georgia,serif; --sc:"Playfair Display SC","Playfair Display",Georgia,serif; --body:"DM Sans",Arial,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;min-height:100vh}
[hidden]{display:none!important}
a{color:var(--maroon)}a:hover{color:var(--maroon-dk)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button{font:inherit}
.boot{padding:40px 16px;color:var(--muted);font-size:15px;margin:0}

/* the dojo floor, from the Nov 4 design */
.floor{background-color:#6e0d12;background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.10) 0 1px,transparent 1px 12px),repeating-linear-gradient(0deg,rgba(0,0,0,.08) 0 1px,transparent 1px 12px),radial-gradient(ellipse 70% 80% at 50% 50%,rgba(160,30,36,.9) 0%,rgba(92,10,14,1) 100%)}
.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--maroon)}
.serif{font-family:var(--display)}
.wordmark{font-family:var(--sc);letter-spacing:.14em;color:var(--cream);padding-bottom:6px;border-bottom:2px solid var(--gold);align-self:flex-start;display:inline-block}
.brandline{font-family:var(--display);font-style:italic;color:var(--goldtext)}

/* ---------------------------------------------------------------- sign-in (Main) */
.gate{min-height:100vh;min-height:100dvh;position:relative;display:flex;flex-direction:column;padding:28px max(24px,env(safe-area-inset-right)) 28px max(24px,env(safe-area-inset-left));color:var(--cream)}
.gate .frame{position:absolute;inset:12px;border:1px solid rgba(201,162,74,.55);pointer-events:none}
.gate .frame:before{content:"";position:absolute;inset:6px;border:1px solid rgba(201,162,74,.25)}
.gate>*{position:relative;z-index:1}
.gate-top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px}
.gate-top .brand{display:flex;flex-direction:column;gap:8px}
.gate-top .wordmark{font-size:19px}
.gate-top .brandline{font-size:14px}
.gate-top .who{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);padding-top:8px}
.gate-body{flex:1;display:flex;flex-direction:column;gap:28px;margin-top:28px}
.gate-pitch{display:flex;flex-direction:column;gap:16px}
.gate-pitch h2{margin:0;font-family:var(--display);font-weight:900;font-size:48px;line-height:.98;color:var(--cream)}
.gate-pitch p{margin:0;font-size:16px;line-height:1.55;color:var(--goldtext);max-width:360px}
.chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px}
.chips span.c{width:30px;height:7px;border-radius:2px}
.chips .t{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-left:6px}
.card{background:var(--cream);color:var(--ink);border-radius:10px;padding:28px 24px 24px;box-shadow:0 30px 60px rgba(0,0,0,.45);border-top:4px solid var(--gold);width:100%;max-width:400px}
.card form,.card .stack{display:flex;flex-direction:column;gap:20px}
.card h1{margin:0;font-family:var(--display);font-weight:700;font-size:32px;line-height:1.1}
.card p{margin:0;font-size:14px;line-height:1.55;color:var(--muted)}
.card .head{display:flex;flex-direction:column;gap:6px}
.card label{font-size:13px;font-weight:700}
.card .field{display:flex;flex-direction:column;gap:8px}
.card input{height:52px;padding:0 16px;font:inherit;font-size:16px;border:1.5px solid #d8cbb5;border-radius:6px;background:#fffdf8;color:var(--ink);width:100%}
.card input::placeholder{color:var(--faint)}
.card input[aria-invalid=true]{border-color:var(--maroon)}
.btn{display:inline-flex;align-items:center;justify-content:center;height:52px;padding:0 20px;border:0;border-radius:6px;background:var(--maroon);color:var(--cream);font-family:var(--body);font-size:16px;font-weight:700;letter-spacing:.02em;cursor:pointer;text-decoration:none}
.btn:hover{color:var(--cream);background:var(--maroon-dk)}
.btn[disabled]{opacity:.65;cursor:default}
.btn.line{background:transparent;border:1.5px solid var(--maroon);color:var(--maroon)}
.btn.line:hover{background:var(--rose);color:var(--maroon)}
.card .small{font-size:13px;line-height:1.5}
.card .fine{font-size:12px;color:var(--faint);margin-top:-8px}
.card .fine a{font-weight:700}
.card .note{font-size:14px;color:var(--ink);background:var(--sand);padding:10px 14px;border-radius:6px}
.gate-warrior{display:flex;justify-content:center}
.gate-warrior img{width:220px;max-width:70%;height:auto;display:block;filter:drop-shadow(0 28px 36px rgba(0,0,0,.5))}
.gate-foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:18px;font-size:12px;color:var(--goldtext)}
.gate-foot a{color:var(--goldtext);text-decoration:none}
.gate-foot .see{color:var(--gold)}

/* ---------------------------------------------------------------- the board (Parent and Student) */
.top{color:var(--cream);border-bottom:3px solid var(--gold);padding:22px 20px 0;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.top .bar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.top .brand{display:flex;flex-direction:column;gap:6px}
.top .wordmark{font-size:15px;padding-bottom:5px}
.top .brandline{font-size:13px;display:none}
.top nav{display:none;flex-wrap:wrap;gap:22px;font-size:14px;font-weight:500}
.top nav a{color:var(--cream);text-decoration:none}
.top nav a:hover{color:var(--gold)}
.out{background:none;border:0;padding:8px 0;color:var(--gold);font-size:12px;cursor:pointer}
.out:hover{text-decoration:underline}
.top nav .out{font-size:14px;font-weight:500;padding:0}
.top .hero{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.top .hero .txt{display:flex;flex-direction:column;gap:6px;padding-bottom:22px;min-width:0}
.top .hero .eyebrow{font-size:10px;color:var(--gold)}
.top .hero h1{margin:0;font-family:var(--display);font-weight:900;font-size:40px;line-height:1}
.top .hero .l1{font-size:13px;color:var(--goldtext)}
.top .hero .l2{font-size:12px;color:var(--goldtext)}
.top .hero img{width:128px;height:auto;display:block;margin-right:-14px;margin-bottom:-6px;filter:drop-shadow(0 14px 18px rgba(0,0,0,.5));flex:none}
main.board{max-width:1120px;margin:0 auto;padding:18px 16px 28px;display:flex;flex-direction:column;gap:18px}
.board h2{margin:0;font-family:var(--display);font-weight:700;font-size:22px;color:var(--ink)}
.sec{display:flex;flex-direction:column;gap:10px;scroll-margin-top:16px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
.sec-head .aside{font-size:13px;color:var(--muted)}
.box{background:var(--cream);border:1px solid var(--line);border-radius:12px}
.muted{color:var(--muted)}

/* parent hero */
.phero{display:flex;flex-direction:column;gap:16px}
.phero .txt{display:flex;flex-direction:column;gap:10px;min-width:0}
.phero h1{margin:0;font-family:var(--display);font-weight:900;font-size:40px;line-height:1}
.phero .plan{margin:4px 0 0;font-size:16px;line-height:1.5;color:var(--muted)}
.beltcard{display:flex;align-items:center;gap:14px;background:var(--cream);border:1px solid var(--line);border-radius:10px;padding:14px 18px;align-self:flex-start}
.beltcard .sw{width:18px;height:18px;border-radius:3px;border:2px solid var(--ink);display:block;flex:none}
.beltcard b{display:block;font-family:var(--display);font-weight:700;font-size:20px}
.beltcard span.s{font-size:13px;color:var(--muted)}

/* the wall */
.wall{border-radius:12px;padding:18px 16px;color:var(--cream);display:flex;flex-direction:column;gap:14px;border:1px solid rgba(201,162,74,.5);scroll-margin-top:16px}
.wall .hd{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
.wall .hd .t{display:flex;flex-direction:column;gap:2px}
.wall .hd .eyebrow{font-size:10px;color:var(--gold)}
.wall .hd .ttl{font-family:var(--display);font-weight:700;font-size:20px}
.wall .hd .why{font-size:13px;color:var(--goldtext)}
.belts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.belt{background:rgba(0,0,0,.18);border:1px dashed rgba(248,243,231,.25);border-radius:8px;padding:12px 8px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.belt .band{width:36px;height:10px;border-radius:2px;display:block}
.belt .n{font-family:var(--display);font-weight:700;font-size:14px;color:var(--goldtext)}
.belt .s{font-size:10px;line-height:1.4;color:var(--goldtext);white-space:pre-line}
.belt.earned{background:rgba(248,243,231,.10);border:1px solid var(--gold)}
.belt.earned .n,.belt.next .n{color:var(--cream)}
.belt.skipped{border-color:rgba(248,243,231,.35)}
.belt.skipped .band{opacity:.5}
.belt.next{border:1px solid rgba(201,162,74,.7)}
.belt.next .s{color:var(--gold);font-weight:700}
.belt.ahead .band{opacity:.45}
.belt.ahead .s{opacity:.8}
.wall .ft{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--goldtext)}
.wall .ft b{color:var(--cream)}

/* three cards */
.trio{display:grid;grid-template-columns:1fr;gap:14px}
.stat{border-radius:12px;padding:20px 22px;display:flex;flex-direction:column;gap:6px;background:var(--cream);border:1px solid var(--line)}
.stat .eyebrow{color:var(--maroon)}
.stat .big{font-family:var(--display);font-weight:900;font-size:44px;line-height:1;color:var(--ink)}
.stat .big small{font-size:20px;font-weight:400;color:var(--muted)}
.stat .sub{font-size:13px;color:var(--muted);margin-top:10px}
.stat.left{background:var(--maroon);border-color:var(--maroon);color:var(--cream)}
.stat.left .eyebrow{color:var(--goldtext);font-weight:400}
.stat.left .big{color:var(--cream)}
.stat.left .big small,.stat.left .sub{color:var(--goldtext)}
.stat.left .sub{margin-top:4px}
.bars{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.bars span{width:16px;height:6px;border-radius:2px;background:rgba(248,243,231,.3)}
.bars span.on{background:var(--gold)}

/* sessions */
.pair{display:grid;grid-template-columns:1fr;gap:14px}
.ses{padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.ses.nextup{border-left:4px solid var(--gold)}
.ses .t{display:flex;flex-direction:column;gap:4px;min-width:0}
.ses .eyebrow.dim{color:var(--faint)}
.ses .w{font-family:var(--display);font-weight:700;font-size:20px}
.ses .s{font-size:13px;color:var(--muted)}
.btn.sm{height:44px;font-size:14px;padding:0 20px}
.snext{background:var(--maroon);color:var(--cream);border-radius:12px;padding:18px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.snext .t{display:flex;flex-direction:column;gap:3px;min-width:0}
.snext .eyebrow{font-size:10px;color:var(--goldtext);font-weight:400}
.snext .w{font-family:var(--display);font-weight:700;font-size:18px}
.snext .s{font-size:12px;color:var(--goldtext)}
.btn.gold{background:var(--gold);color:var(--ink);height:44px;font-size:14px;padding:0 16px;white-space:nowrap}
.btn.gold:hover{background:#d6b05a;color:var(--ink)}

/* moves */
.moves{display:flex;flex-direction:column;gap:10px}
.move{padding:16px 18px;display:grid;grid-template-columns:32px minmax(0,1fr);gap:6px 14px;align-items:center}
.move .num{font-family:var(--display);font-weight:900;font-size:26px;color:var(--gold)}
.move .t{display:flex;flex-direction:column;gap:3px;min-width:0}
.move .t b{font-family:var(--display);font-weight:700;font-size:18px}
.move .t span{font-size:13px;color:var(--muted)}
.move .pill{grid-column:2;justify-self:start}
.pill{font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;white-space:nowrap;background:var(--sand);color:var(--muted)}
.pill.struck{background:var(--green);color:var(--cream)}
.pill.work{background:var(--rose);color:var(--maroon)}
.smove{padding:14px 16px;display:flex;gap:12px;align-items:center}
.smove.work{border-left:4px solid var(--gold)}
.smove .dot{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none;background:var(--sand);color:var(--muted)}
.smove .dot.struck{background:var(--green);color:var(--cream)}
.smove .dot.work{background:var(--maroon);color:var(--cream)}
.smove .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.smove .t b{font-family:var(--display);font-weight:700;font-size:16px}
.smove .t span{font-size:12px;color:var(--muted)}
.count{font-family:var(--display);font-weight:900;font-size:22px;color:var(--maroon)}
.count small{font-size:14px;font-weight:400;color:var(--muted)}
.lead{margin:0;font-size:13px;line-height:1.5;color:var(--muted)}

/* homework */
.hw{padding:16px;display:flex;flex-direction:column;gap:12px}
.hw .r{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hw .r .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.hw .r b{font-size:15px}
.hw .r span.s{font-size:12px;color:var(--muted)}
.track{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.track span{display:block;height:8px;background:var(--gold)}

/* score log (student) */
.slog{padding:16px;display:flex;flex-direction:column;gap:10px}
.slog .r{display:grid;grid-template-columns:minmax(0,1fr) 70px 70px;gap:8px;font-size:14px;align-items:baseline}
.slog .r span+span{text-align:right}
.slog .r.h{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.slog .r.plan{color:var(--faint)}

/* friday update */
.update{padding:22px 20px;display:flex;flex-direction:column;gap:12px;max-width:760px}
.update .meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.update .meta span+span{font-size:12px;color:var(--faint)}
.update p{margin:0;font-size:15px;line-height:1.6;white-space:pre-line}
.update .so{font-family:var(--display);font-size:16px;margin-top:4px}
.update .by{font-size:14px;color:var(--muted)}
.empty{margin:0;color:var(--muted);font-size:15px}

/* billing */
.bill{overflow:hidden}
.bill .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;padding:16px 18px;border-bottom:1px solid var(--line);align-items:center}
.bill .row .it{font-size:15px}
.bill .row .st{font-size:13px;font-weight:700;color:var(--muted);grid-column:1}
.bill .row .st.paid{color:var(--green)}
.bill .row .st.bad{color:#8a4b0f}
.bill .row .amt{font-size:15px;font-weight:700;text-align:right;grid-column:2;grid-row:1}
.bill .row .msg{grid-column:1/-1;font-size:13px;color:var(--muted)}
.bill .row .act{grid-column:2;justify-self:end}
.bill .row.offer .it{font-weight:700}
.bill .foot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;padding:16px 18px;background:var(--cream2)}
.bill .foot span{font-size:13px;color:var(--muted)}
.bill .status{padding:0 18px 16px;margin:0;font-size:13px;color:var(--muted);background:var(--cream2)}
.btn.line.sm{height:44px;font-size:14px;padding:0 18px}

footer.foot{border-top:1px solid var(--line);padding:16px 20px 24px;display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
footer.foot .line{font-family:var(--display);font-style:italic;color:var(--maroon)}

/* ---------------------------------------------------------------- desktop */
@media (min-width:900px){
  .gate{padding:48px 56px 40px}
  .gate .frame{inset:22px}
  .gate-top .wordmark{font-size:22px}
  .gate-top .brandline{font-size:15px}
  .gate-body{flex-direction:row;flex-wrap:wrap;align-items:flex-end;gap:32px;margin-top:24px}
  .gate-warrior{order:1;flex:0 1 340px;align-self:flex-end}
  .gate-warrior img{width:340px;max-width:100%}
  .gate-pitch{order:2;flex:1 1 300px;align-self:center;padding-bottom:40px;gap:18px}
  .gate-pitch h2{font-size:68px}
  .gate-body>.card{order:3;flex:0 1 400px;align-self:center;padding:36px 36px 30px}
  .top{padding:22px 48px;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
  .top .wordmark{font-size:18px}
  .top .brandline{display:block}
  .top nav{display:flex}
  .top .bar>.out{display:none}
  .top .hero{display:none}
  main.board{padding:44px 32px 64px;gap:40px}
  .board h2{font-size:26px}
  .sec{gap:14px}
  .phero{flex-direction:row;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:24px}
  .phero .txt{flex:1 1 520px}
  .phero h1{font-size:56px}
  .phero .plan{font-size:17px}
  .beltcard{align-self:auto}
  .wall{border-radius:14px;padding:26px 28px 28px;gap:18px}
  .wall .hd .eyebrow{font-size:11px}
  .wall .hd .ttl{font-size:24px}
  .belts{grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
  .belt{border-radius:10px;padding:16px 14px;gap:10px}
  .belt .band{width:44px;height:12px;border-radius:3px}
  .belt .n{font-size:16px}
  .belt .s{font-size:11px}
  .trio{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
  .stat{padding:22px 24px}
  .stat .big{font-size:48px}
  .pair{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ses{padding:20px 22px}
  .move{grid-template-columns:44px minmax(0,1fr) 120px;gap:16px;padding:18px 22px}
  .move .num{font-size:28px}
  .move .pill{grid-column:3;justify-self:end}
  .update{padding:26px 30px}
  .bill .row{grid-template-columns:minmax(0,1fr) 140px 120px;padding:16px 22px}
  .bill .row .st{grid-column:2;grid-row:1}
  .bill .row .amt{grid-column:3}
  .bill .row .act{grid-column:2;grid-row:1;justify-self:start}
  .bill .row.offer .act{grid-column:2/4;justify-self:end}
  .bill .row.offer .msg{grid-column:1;grid-row:2}
  .bill .foot{padding:16px 22px}
  .bill .status{padding:0 22px 16px}
  footer.foot{padding:22px 48px;flex-direction:row;justify-content:space-between;flex-wrap:wrap;gap:10px;font-size:13px}
  /* the student board keeps its phone layout, centred, on a wide screen */
  .student .top{flex-direction:column;align-items:stretch}
  .student .top .hero{display:flex}
  .student .top .bar>.out{display:inline}
  .student .top .brandline{display:none}
  .student .top,.student main.board,.student footer.foot{max-width:560px;margin-left:auto;margin-right:auto;width:100%}
  .student .top{border-radius:0 0 12px 12px}
  .student main.board{padding:24px 16px 32px;gap:22px}
  .student footer.foot{flex-direction:column}
}
</style>
</head>
